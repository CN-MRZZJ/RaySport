<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="rl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- 外环 -->
  <circle cx="60" cy="60" r="48" stroke="url(#rg)" stroke-width="3" fill="none"/>
  <circle cx="60" cy="60" r="36" stroke="url(#rg)" stroke-width="1.2" fill="none" opacity="0.35"/>

  <!-- Ray — 对角锐利切割 -->
  <path d="M30 30l60 60" stroke="url(#rg)" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 30l7-7" stroke="url(#rl)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M90 90l6 6" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

  <!-- Sport — 弯道弧线 -->
  <path d="M86 42c-6-10-20-14-30-7" stroke="url(#rl)" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- 中心点 -->
  <circle cx="60" cy="60" r="4" fill="url(#rg)"/>
</svg>
